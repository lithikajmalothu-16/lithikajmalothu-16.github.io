<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lithika Jadav</title>
<meta name="description" content="Lithika Jadav Malothu — computer science, data analytics, and sustainability. Most interested in the grid.">
<!-- Terminal-style monospace, same family of look as the reference site -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:       #000000;
    --card:     #0d0d0d;
    --line:     #262626;
    --text:     #d4d4d4;
    --dim:      #8a8a8a;
    --white:    #f5f5f5;
    --mono:     "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--mono);
    font-size:16px;
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:var(--white); text-decoration:underline; text-underline-offset:5px; text-decoration-thickness:1px; }
  a:hover{ color:#fff; }
  ::selection{ background:#333; color:#fff; }

  .wrap{ max-width:900px; margin:0 auto; padding:0 24px; }

  /* ---------- header ---------- */
  header{
    position:sticky; top:0; z-index:10;
    background:rgba(0,0,0,.9); backdrop-filter:blur(8px);
    border-bottom:1px solid #111;
  }
  .nav{
    display:flex; align-items:center; justify-content:space-between;
    max-width:1200px; margin:0 auto; padding:26px 32px;
    gap:16px; flex-wrap:wrap;
  }
  .brand{
    font-weight:700; color:var(--white); font-size:16px;
    cursor:pointer; text-decoration:none;
  }
  nav.tabs{ display:flex; gap:32px; flex-wrap:wrap; }
  nav.tabs button{
    background:none; border:none; cursor:pointer;
    font-family:var(--mono); font-size:15px; color:var(--dim);
    padding:2px 0;
  }
  nav.tabs button:hover{ color:var(--white); }
  nav.tabs button.active{ color:var(--white); font-weight:700; }
  nav.tabs button:focus-visible{ outline:1px solid var(--white); outline-offset:4px; }

  /* ---------- pages ---------- */
  .page{ display:none; padding:110px 0 140px; animation:fade .3s ease; }
  .page.active{ display:block; }
  @keyframes fade{ from{opacity:0;} to{opacity:1;} }
  @media (prefers-reduced-motion: reduce){ .page{ animation:none; } }
